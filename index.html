<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parsel Harita & Ulusal Koordinat Analiz Sistemi</title>

  <!-- Leaflet Harita CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Proj4js (Projeksiyon ve Koordinat Dönüşüm Motoru) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
    }

    /* 1. ÜST TEK İNCE YATAY SATIR */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-logo {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 4px;
      white-space: nowrap;
    }

    .brand-logo svg {
      width: 16px;
      height: 16px;
      fill: #38bdf8;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .input-group label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
      white-space: nowrap;
    }

    select, input[type="number"], input[type="text"] {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }

    select:focus, input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }

    #select-il { min-width: 125px; cursor: pointer; }
    #select-ilce { min-width: 125px; cursor: pointer; }
    #select-mahalle { min-width: 140px; cursor: pointer; }

    #input-ada { width: 75px; text-align: center; }
    #input-parsel { width: 75px; text-align: center; }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    button.btn-sorgula {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      color: #ffffff;
      height: 32px;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;

      align-items: center;

      transition: all 0.2s;

      height: 22px;

    button.btn-util {

      cursor: pointer;

      white-space: nowrap;
    }

    button.btn-util:hover {
      background: #475569;
      color: #ffffff;
    }

    /* 2. TAM EKRAN HARİTA ALANI */
    #map {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* 3. SAĞ ALT MEKÂNSAL BİLGİ PANELİ (HUD) */
    #hud-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 380px;
      max-height: calc(100vh - 90px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      z-index: 1000;
      padding: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      display: none;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }

    .badge-dom {
      background: #0369a1;
      color: #e0f2fe;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .meta-item {
      background: #1e293b;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid #334155;
    }

    .meta-label {
      color: #94a3b8;
      font-size: 10px;
      display: block;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .meta-val {
      font-size: 11px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .coord-container {
      border: 1px solid #334155;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
      background: #0b1120;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      text-align: right;
    }

    th, td {
      padding: 5px 6px;

      color: #94a3b8;

      font-size: 12px;
      font-weight: 600;
      z-index: 2000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    }
  </style>
</head>

  <!-- Leaflet JS -->

  <script>
    /* ==========================================================================

    ];

    // Bursa ilçeleri için doğrudan yerel hızlı liste
    const BURSA_ILCELERI = [
      { id: 1198, ad: "Büyükorhan" }, { id: 1343, ad: "Gemlik" }, { id: 1935, ad: "Gürsu" },
      { id: 1378, ad: "Harmancık" }, { id: 1411, ad: "İnegöl" }, { id: 1420, ad: "İznik" },
      { id: 1434, ad: "Karacabey" }, { id: 1457, ad: "Keles" }, { id: 1960, ad: "Kestel" },
      { id: 1530, ad: "Mudanya" }, { id: 1535, ad: "Mustafakemalpaşa" }, { id: 1829, ad: "Nilüfer" },
      { id: 1553, ad: "Orhaneli" }, { id: 1554, ad: "Orhangazi" }, { id: 1832, ad: "Osmangazi" },
      { id: 1725, ad: "Yenişehir" }, { id: 1859, ad: "Yıldırım" }
    ];

    /* ==========================================================================
       HARİTA BAŞLATMA
       ========================================================================== */
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([40.23, 28.95], 11);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    const googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22 }).addTo(map);
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    L.control.layers({ "Google Hibrit Uydu": googleSatellite, "Sokak Haritası": osmLayer }, null, { position: 'bottomleft' }).addTo(map);

    let activePolygonLayer = null;
    let loadedGeoJson = null;
    let convertedItrfCoords = [];

    /* ==========================================================================
       ULUSAL KOORDİNAT SİSTEMİ (ITRF96 TM 3° / GRS80) ÇEVRİMİ
       ========================================================================== */
    function wgs84ToItrf96(lon, lat, overrideDom = null) {
      const dom = overrideDom !== null ? overrideDom : Math.round(lon / 3.0) * 3;

      const itrfDef = `+proj=tmerc +lat_0=0 +lon_0=${dom} +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +units=m +no_defs`;
      const wgs84Def = '+proj=longlat +datum=WGS84 +no_defs';

      const [easting, northing] = proj4(wgs84Def, itrfDef, [lon, lat]);
      return {
        dom: dom,
        y: Number(easting.toFixed(3)),
        x: Number(northing.toFixed(3))
      };
    }

    function calculatePolygonAreaMetric(points) {
      let area = 0.0;
      const n = points.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        area += points[i].y * points[j].x;
        area -= points[j].y * points[i].x;
      }
      return Math.abs(area) / 2.0;
    }

    /* ==========================================================================
       GEOJSON PARSEL ÇİZİMİ & ULUSAL SİSTEME UYGULAMA (PROPARCEL ANLAYIŞI)
       ========================================================================== */
    function applyParcelGeoJson(geoJsonData, meta = {}) {
      if (activePolygonLayer) {
        map.removeLayer(activePolygonLayer);
      }
      loadedGeoJson = geoJsonData;

      activePolygonLayer = L.geoJSON(geoJsonData, {
        style: {
          color: '#ef4444',
          weight: 2.5,
          opacity: 1,
          fillColor: '#0284c7',
          fillOpacity: 0.28
        }
      }).addTo(map);

      map.fitBounds(activePolygonLayer.getBounds(), { padding: [70, 70], maxZoom: 19 });

      const geom = geoJsonData.geometry || (geoJsonData.features && geoJsonData.features[0].geometry);
      let rawRing = [];
      if (geom.type === 'Polygon') {
        rawRing = geom.coordinates[0];
      } else if (geom.type === 'MultiPolygon') {
        rawRing = geom.coordinates[0][0];
      }

      if (!rawRing || rawRing.length === 0) return;

      convertedItrfCoords = [];
      const tbody = document.getElementById('coord-tbody');
      tbody.innerHTML = '';

      let detectedDom = null;

      rawRing.forEach((pt, idx) => {
        const [lon, lat] = pt;
        const itrf = wgs84ToItrf96(lon, lat, detectedDom);
        detectedDom = itrf.dom;

        convertedItrfCoords.push({
          no: idx + 1,
          y: itrf.y,
          x: itrf.x,
          lon: lon,
          lat: lat
        });

        const tr = document.createElement('tr');
        tr.innerHTML = `<td>P${idx + 1}</td><td>${itrf.y.toFixed(3)}</td><td>${itrf.x.toFixed(3)}</td>`;
        tbody.appendChild(tr);
      });

      const calcArea = calculatePolygonAreaMetric(convertedItrfCoords);

      document.getElementById('hud-title').innerText = `${meta.ada || '-'} Ada / ${meta.parsel || '-'} Parsel`;
      document.getElementById('hud-dom').innerText = `ITRF96 DOM ${detectedDom}°`;
      document.getElementById('hud-loc').innerText = `${meta.il || ''} - ${meta.ilce || ''} / ${meta.mahalle || ''}`;
      document.getElementById('hud-meta').innerText = `${meta.nitelik || 'Arsa'} (Pafta: ${meta.pafta || '-'})`;
      document.getElementById('hud-deed-area').innerText = meta.tapuAlani ? `${meta.tapuAlani}` : '-';
      document.getElementById('hud-calc-area').innerText = `${calcArea.toLocaleString('tr-TR', { maximumFractionDigits: 2 })} m²`;

      document.getElementById('hud-panel').style.display = 'flex';
    }

    /* ==========================================================================
       AUTOCAD KOMUTU ÜRETİCİSİ (0,0 ORIJIN KAYDIRMALI KAPALI POLİGON)
       ========================================================================== */
    function copyAutoCadPline() {
      if (!convertedItrfCoords.length) return;

      const p1 = convertedItrfCoords[0];
      let script = `_LAYER _M PARSEL_SINIRI _C 1 PARSEL_SINIRI\n_PLINE\n`;

      convertedItrfCoords.forEach(p => {
        const dx = (p.y - p1.y).toFixed(3);
        const dy = (p.x - p1.x).toFixed(3);
        script += `${dx},${dy}\n`;
      });
      script += `_C\n_ZOOM _E\n`;

      navigator.clipboard.writeText(script).then(() => {
        alert("AutoCAD komut dizisi panoya kopyalandı!\nAutoCAD komut satırına (Command Line) yapıştırabilirsiniz.");
      });
    }

    function downloadGeoJson() {
      if (!loadedGeoJson) return;
      const blob = new Blob([JSON.stringify(loadedGeoJson, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `parsel_${Date.now()}.geojson`;
      a.click();
    }

    /* ==========================================================================
       PARSEL SORGULAMA MOTORU & DIŞ SERVİS BAĞLANTISI
       ========================================================================== */
    async function fetchWithFallbackProxy(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {
        console.warn("Doğrudan erişim CORS engeline takıldı, vekil deneniyor...");
      }

      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        if (res.ok) return await res.json();
      } catch (e) {
        console.warn("AllOrigins vekili yanıt vermedi, ikinci vekil deneniyor...");
      }

      try {
        const res2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        if (res2.ok) return await res2.json();
      } catch (e) {}

      throw new Error("Kamu CBS servisine ulaşılamadı.");
    }

    async function triggerQuery() {
      const ilEl = document.getElementById('select-il');
      const ilceEl = document.getElementById('select-ilce');
      const mahalleEl = document.getElementById('select-mahalle');
      const adaVal = document.getElementById('input-ada').value.trim();
      const parselVal = document.getElementById('input-parsel').value.trim();

      if (!mahalleEl.value || !adaVal || !parselVal) {
        alert("Lütfen İl, İlçe, Mahalle seçimi yapın; Ada ve Parsel numaralarını girin.");
        return;
      }

      const toast = document.getElementById('loading-toast');
      toast.style.display = 'block';

      const mahalleId = mahalleEl.value;
      const targetApi = `https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api/parsel/${mahalleId}/${adaVal}/${parselVal}`;

      try {
        const data = await fetchWithFallbackProxy(targetApi);
        toast.style.display = 'none';

        if (data && (data.geometry || data.features)) {
          applyParcelGeoJson(data, {
            il: ilEl.options[ilEl.selectedIndex].text,
            ilce: ilceEl.options[ilceEl.selectedIndex].text,
            mahalle: mahalleEl.options[mahalleEl.selectedIndex].text,
            ada: adaVal,
            parsel: parselVal,
            tapuAlani: data.properties?.alan,
            nitelik: data.properties?.nitelik,
            pafta: data.properties?.pafta
          });
        } else {
          alert("Parsel geometrisi bulunamadı.");
        }
      } catch (err) {
        toast.style.display = 'none';
        alert("Kamu servisi geçici olarak yanıt vermedi. 'Bursa Nilüfer Örnek' veya 'GeoJSON Yapıştır' ile sistemi anında test edebilirsiniz.");
      }
    }

    /* ==========================================================================
       ÖRNEK VERİ & GEOJSON MODALI
       ========================================================================== */

      const sample = {
        "type": "Feature",
        "geometry": {
          "type": "Polygon",
          "coordinates": [[
            [28.93245, 40.24580],
            [28.93385, 40.24570],
            [28.93375, 40.24490],
            [28.93230, 40.24505],
            [28.93245, 40.24580]
          ]]
        },
        "properties": {
          "alan": "10.450,00 m²",
          "nitelik": "Sanayi Arsası",
          "pafta": "H21-C-05-A"
        }
      };

      document.getElementById('input-ada').value = "1483";
      document.getElementById('input-parsel').value = "8";

      applyParcelGeoJson(sample, {
        il: "Bursa",
        ilce: "Nilüfer",
        mahalle: "Minareliçavuş",

      });

    function openGeoJsonModal() {
      const raw = prompt("GeoJSON metnini veya koordinat dizisini yapıştırın:");
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        const feat = parsed.type === 'FeatureCollection' ? parsed.features[0] : (parsed.type === 'Feature' ? parsed : { type: 'Feature', geometry: parsed });
        applyParcelGeoJson(feat, {
          il: "Özel",
          ilce: "Girdi",
          mahalle: "GeoJSON",
          ada: "-",
          parsel: "-",
          tapuAlani: "-",
          nitelik: "Vektör Poligon"
        });
      } catch (e) {
        alert("Geçersiz GeoJSON formatı!");
      }
    }

    /* ==========================================================================
       SAYFA BAŞLATMA & 81 İL / İLÇE DOLDURMA
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      const ilSelect = document.getElementById('select-il');
      const ilceSelect = document.getElementById('select-ilce');
      const mahalleSelect = document.getElementById('select-mahalle');

      // 81 İlin Tamamını Alfabetik Doldur
      TURKIYE_81_IL.forEach(il => {
        const opt = document.createElement('option');
        opt.value = il.id;
        opt.innerText = il.ad;
        ilSelect.appendChild(opt);
      });

      // İl Seçildiğinde
      ilSelect.addEventListener('change', async (e) => {
        const ilId = Number(e.target.value);
        ilceSelect.innerHTML = '<option value="">Yükleniyor...</option>';
        ilceSelect.disabled = true;
        mahalleSelect.innerHTML = '<option value="">Önce İlçe Seçin</option>';
        mahalleSelect.disabled = true;

        if (!ilId) return;

        // Bursa seçilmişse doğrudan yerel veri ile anında aç
        if (ilId === 16) {
          populateIlceler(BURSA_ILCELERI);
          return;
        }

        try {
          const url = `https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api/idariYapi/ilceListe/${ilId}`;
          const data = await fetchWithFallbackProxy(url);
          populateIlceler(data);
        } catch (err) {
          ilceSelect.innerHTML = '<option value="">İlçeler Alınamadı (Tekrar Deneyin)</option>';
        }
      });

      function populateIlceler(list) {
        ilceSelect.innerHTML = '<option value="">İlçe Seçiniz...</option>';
        list.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.innerText = item.text || item.ad;
          ilceSelect.appendChild(opt);
        });
        ilceSelect.disabled = false;
      }

      // İlçe Seçildiğinde
      ilceSelect.addEventListener('change', async (e) => {
        const ilceId = e.target.value;
        mahalleSelect.innerHTML = '<option value="">Yükleniyor...</option>';
        mahalleSelect.disabled = true;

        if (!ilceId) return;

        try {
          const url = `https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api/idariYapi/mahalleListe/${ilceId}`;
          const data = await fetchWithFallbackProxy(url);
          mahalleSelect.innerHTML = '<option value="">Mahalle Seçiniz...</option>';
          data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.innerText = item.text || item.ad;
            mahalleSelect.appendChild(opt);
          });
          mahalleSelect.disabled = false;
        } catch (err) {
          mahalleSelect.innerHTML = '<option value="">Mahalleler Alınamadı</option>';
        }
      });
    });
  </script>
